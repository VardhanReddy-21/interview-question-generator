<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bookGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle Container with Gradient Stroke -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0b0f19" stroke="url(#bookGlow)" stroke-width="2"/>
  
  <!-- Subtle inner background glow -->
  <circle cx="24" cy="24" r="15" fill="url(#bookGlow)" opacity="0.16"/>
  
  <!-- Floating Knowledge Spark (above the open book) -->
  <path d="M24 6 L25.5 11.5 L31 13 L25.5 14.5 L24 20 L22.5 14.5 L17 13 L22.5 11.5 Z" fill="url(#goldSpark)"/>
  
  <!-- Little side sparks -->
  <circle cx="14" cy="11" r="1.2" fill="#67e8f9" opacity="0.9"/>
  <circle cx="34" cy="11" r="1.2" fill="#f472b6" opacity="0.9"/>

  <!-- Book Pages - Left Wing (Open) -->
  <path d="M24 38 C19 35.5 13 35.5 8 38 L8 22 C13 19.5 19 19.5 24 22 Z" fill="url(#pageGradLeft)"/>
  <path d="M24 35 C19 33 13 33 9 35 L9 20 C13 18 19 18 24 20 Z" fill="#93c5fd" opacity="0.38"/>
  
  <!-- Book Pages - Right Wing (Open) -->
  <path d="M24 38 C29 35.5 35 35.5 40 38 L40 22 C35 19.5 29 19.5 24 22 Z" fill="url(#pageGradRight)"/>
  <path d="M24 35 C29 33 35 33 39 35 L39 20 C35 18 29 18 24 20 Z" fill="#f9a8d4" opacity="0.38"/>

  <!-- Left Page Code/Text Lines -->
  <line x1="12" y1="24.5" x2="20" y2="23.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="12" y1="28" x2="19" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="12" y1="31.5" x2="17" y2="30.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Right Page Code/Text Lines -->
  <line x1="28" y1="23.5" x2="36" y2="24.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="29" y1="27" x2="36" y2="28" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="31" y1="30.5" x2="36" y2="31.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Center Book Spine & Bookmark Ribbon -->
  <path d="M23.2 21.5 L24 38.5 L24.8 21.5" stroke="#312e81" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Glowing Emerald Bookmark dropping down center -->
  <path d="M23.5 22 L24.5 22 L24.5 31 L24 29.5 L23.5 31 Z" fill="#10b981"/>
</svg>
